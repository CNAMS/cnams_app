include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # NFR-16: hardcoded user-facing strings must fail the build.
    # (Enforced via a custom lint / CI grep step; see tool/check_hardcoded_strings.dart)
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/generated/**"

linter:
  rules:
    - always_use_package_imports
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
    - avoid_print
