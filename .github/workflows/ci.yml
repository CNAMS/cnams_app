name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # Generated code (drift, l10n) is intentionally not committed, so
      # regenerate it before anything reads it.
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      # Formatting excludes generated files (see the format target below).
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v -E '\.g\.dart$|/generated/')

      # NFR-16: fail the build on hardcoded user-facing strings.
      - run: dart run tool/check_hardcoded_strings.dart

      - run: flutter analyze

      # Run Flutter test suite with detailed Markdown summary & report
      - name: Run Flutter Tests & Generate Report
        run: dart run tool/report_tests.dart

      # Post/update PR comment with test report if triggered from a Pull Request
      - name: Comment Test Report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('test_summary.md')) {
              const report = fs.readFileSync('test_summary.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Flutter Test Suite Report'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: report,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report,
                });
              }
            }

      - run: flutter build apk --release
