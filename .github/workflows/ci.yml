name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # Generated code (drift, l10n) is intentionally not committed, so
      # regenerate it before anything reads it.
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      # Formatting excludes generated files (see the format target below).
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v -E '\.g\.dart$|/generated/')

      # NFR-16: fail the build on hardcoded user-facing strings.
      - run: dart run tool/check_hardcoded_strings.dart

      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
