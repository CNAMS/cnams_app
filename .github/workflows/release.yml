name: Build & Release App

on:
  # Every green CI run on main publishes a release automatically, so the APK
  # under Releases > Latest is always the current main. Gating on CI (rather
  # than on push) means a commit that fails tests never ships.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0-beta)'
        required: false
        default: 'v0.1.0-dev'
      release_name:
        description: 'Release Name'
        required: false
        default: 'Ankur CGMS Development Build'

# Never build two releases at once; a newer main supersedes a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. BUILD ANDROID (ALL ARCHITECTURES: UNIVERSAL, ARM64, ARM32, X86_64 & AAB)
  # ==========================================================================
  build-android:
    name: Build Android (All Architectures)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations & Database Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # One key (alias "ankur") signs every release, so each APK installs over
      # the last and a worker never has to uninstall (and lose offline data)
      # to update. Refuse to publish if the key is missing: a debug-signed APK
      # cannot update a release-signed one.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ankur-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/ankur-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # versionCode must rise with every release or Android refuses the update.
      - name: Build Universal Android APK (All CPU architectures in one file)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Split-per-ABI Android APKs (Optimized sizes for arm64, armv7, x86_64)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Verify the APK carries the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::APK is debug-signed"; exit 1
          fi

      - name: Prepare & Organize Android Output Artifacts
        run: |
          mkdir -p output/android
          # Copy Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk output/android/Ankur-CGMS-android-universal.apk
          # Copy Per-Architecture APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/android/Ankur-CGMS-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output/android/Ankur-CGMS-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output/android/Ankur-CGMS-android-x86_64.apk
          # Copy Google Play App Bundle
          cp build/app/outputs/bundle/release/app-release.aab output/android/Ankur-CGMS-android-appbundle.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: output/android/
          retention-days: 7

  # ==========================================================================
  # 2. BUILD IOS (IPA & Runner.app)
  # ==========================================================================
  build-ios:
    name: Build iOS (IPA & Runner.app)
    # macos-latest, not a pinned image: GitHub retired macos-14, and a retired
    # image cancels the job before it starts — which silently blocked every
    # release, Android included.
    runs-on: macos-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations & Database Code
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (No Codesign for Development/Ad-Hoc)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package iOS IPA & Runner.app
        run: |
          mkdir -p output/ios/Payload
          cp -r build/ios/iphoneos/Runner.app output/ios/Payload/
          cd output/ios
          zip -r Ankur-CGMS-ios-development.ipa Payload
          rm -rf Payload
          cd ../..
          cd build/ios/iphoneos
          zip -r ../../../output/ios/Ankur-CGMS-ios-Runner.app.zip Runner.app
          cd ../../..

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: output/ios/
          retention-days: 7

  # ==========================================================================
  # 3. PUBLISH GITHUB RELEASE
  # ==========================================================================
  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    # Field workers install the Android APK; an iOS build failure must not
    # hold it back. Publish whenever Android succeeded, with the iOS files
    # attached only if that build succeeded too.
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release_assets/

      - name: Download iOS Artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-builds
          path: release_assets/

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            TAG="v${VERSION}-build.${{ github.run_number }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=Ankur CGMS $VERSION (build ${{ github.run_number }})" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=Ankur CGMS Release $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # The iOS files are absent when that build failed; publish the
          # Android files rather than failing the whole release.
          fail_on_unmatched_files: false
          files: |
            release_assets/Ankur-CGMS-android-universal.apk
            release_assets/Ankur-CGMS-android-arm64-v8a.apk
            release_assets/Ankur-CGMS-android-armeabi-v7a.apk
            release_assets/Ankur-CGMS-android-x86_64.apk
            release_assets/Ankur-CGMS-android-appbundle.aab
            release_assets/Ankur-CGMS-ios-development.ipa
            release_assets/Ankur-CGMS-ios-Runner.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
